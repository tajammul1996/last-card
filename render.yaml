services:
  - type: web
    name: last-card
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: REDIS_URL
        fromService:
          name: last-card-store
          type: keyvalue
          property: connectionString
      # Permanent store for accounts and the leaderboard (Upstash Redis URL, starting rediss://).
      # Set the value in the Render dashboard; it is never kept in this repo.
      - key: STORE_URL
        sync: false
      # Account names that can open the admin screen, comma separated (e.g. Tajammul).
      - key: ADMIN_NAMES
        sync: false
      # Usage analytics (PostHog). Leave POSTHOG_KEY empty to switch tracking off.
      # POSTHOG_HOST: https://us.i.posthog.com (US) or https://eu.i.posthog.com (EU)
      - key: POSTHOG_KEY
        sync: false
      - key: POSTHOG_HOST
        sync: false
      # Your own address, e.g. saylastcard.com. Once set, onrender.com visitors move there, still signed in.
      - key: PUBLIC_HOST
        sync: false
      # Email sign-in codes through Resend: the API key, and a sender on a domain verified there.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  # Keeps every table saved while the game server redeploys or restarts.
  - type: keyvalue
    name: last-card-store
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # only reachable from your Render services
